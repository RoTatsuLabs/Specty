name: Build FFmpegKit

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Tag or branch of arthenica/ffmpeg-kit-next to build
        required: true
        default: v9.0.2
        type: string
      revision:
        description: Our revision of this build, for example r1 (a version can only be published once)
        required: true
        default: r1
        type: string
      profile:
        description: full builds everything upstream does; minimal keeps only what the audio analyser needs (experimental)
        required: true
        default: full
        type: choice
        options:
          - full
          - minimal
      publish:
        description: Publish to GitHub Packages
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ffmpegkit
  cancel-in-progress: false

env:
  SOURCE_REPO: arthenica/ffmpeg-kit-next
  GROUP_ID: com.rotatsulabs.specty
  # The ABIs Specty ships, 32-bit ARM included. Upstream builds one architecture per job because of the six hour limit with every
  # external library enabled; with none enabled all of them should fit in one job.
  ARCHS: arm-v7a,arm-v7a-neon,arm64-v8a,x86-64
  ANDROID_PLATFORM_VERSION: '34'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_NDK_VERSION: '27.3.13750724'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  build:
    name: Build FFmpegKit (${{ inputs.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout FFmpegKitNext
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.source_ref }}
          path: kit
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config gettext autopoint \
            cmake bison meson ninja-build nasm yasm gperf ragel texinfo autogen \
            groff gtk-doc-tools libtasn1-6-dev tcl doxygen \
            gcc g++ make patch file findutils gawk rsync \
            python3 perl ruby curl wget git zip unzip xz-utils tar gzip sed grep diffutils \
            bash which

      - name: Set up Android SDK and NDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDK_MANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes 2>/dev/null | "${SDK_MANAGER}" --licenses >/dev/null || true
          "${SDK_MANAGER}" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          {
            echo "ANDROID_SDK_ROOT=${SDK_ROOT}"
            echo "ANDROID_HOME=${SDK_ROOT}"
            echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Build
        id: build
        env:
          KIT_DIR: ${{ github.workspace }}/kit
          OUT_DIR: ${{ github.workspace }}/maven
          PROFILE: ${{ inputs.profile }}
          REVISION: ${{ inputs.revision }}
        run: bash .github/scripts/build-ffmpegkit.sh

      - name: Print build log
        if: ${{ always() }}
        run: '[ -f kit/build.log ] && tail -n 300 kit/build.log || true'

      - name: Print FFmpeg configure log
        if: ${{ failure() }}
        run: '[ -f kit/src/ffmpeg/ffbuild/config.log ] && tail -n 80 kit/src/ffmpeg/ffbuild/config.log || true'

      - name: Upload Maven bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-kit-next-${{ steps.build.outputs.version }}
          path: maven
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Packages
        if: ${{ inputs.publish }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEST: ${{ steps.build.outputs.dest }}
        run: |
          set -euo pipefail
          base="https://maven.pkg.github.com/${GITHUB_REPOSITORY}/${GROUP_ID//.//}/ffmpeg-kit-next/${{ steps.build.outputs.version }}"
          for file in "$DEST"/*; do
            curl -fsS -u "x-access-token:${TOKEN}" -X PUT -T "$file" "$base/$(basename "$file")"
          done

      - name: Summary
        env:
          VERSION: ${{ steps.build.outputs.version }}
          DEST: ${{ steps.build.outputs.dest }}
        run: |
          {
            echo "### ffmpeg-kit-next $VERSION (${{ inputs.profile }})"
            echo "- Source: \`$SOURCE_REPO\` at \`${{ inputs.source_ref }}\`"
            echo "- Coordinates: \`$GROUP_ID:ffmpeg-kit-next:$VERSION\`"
            echo "- ABIs: \`$ARCHS\`"
            echo '```'
            (cd "$DEST" && ls -l && sha256sum -- *)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
