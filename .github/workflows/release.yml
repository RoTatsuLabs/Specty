name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Official app version (X.Y.Z)
        required: true
        type: string
      version_code:
        description: versionCode override (defaults to major*10000 + minor*100 + patch)
        required: false
        type: string
      release_type:
        description: How to publish the GitHub Release
        required: true
        type: choice
        default: draft
        options:
          - draft
          - prerelease
          - release

permissions:
  contents: read
  packages: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_NAME: Specty
  PACKAGE_ID: com.rotatsulabs.specty
  GRADLE_TASK: :app:assembleRelease
  APK_DIR: app/build/outputs/apk/release
  VARIANTS: armeabi-v7a:armeabi-v7a arm64-v8a:arm64-v8a x86_64:x86_64 universal:armeabi-v7a,arm64-v8a,x86_64

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPECTY_PACKAGES_USER: ${{ github.actor }}
      SPECTY_PACKAGES_TOKEN: ${{ secrets.SPECTY_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.version.outputs.apk_version }}
    steps:
      # The branch picked in the run dialog is the one that gets released.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          MODE: release
          SOURCE_REF: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
        run: bash .github/scripts/resolve-version.sh

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the tag is free
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.apk_version }}
        run: bash .github/scripts/check-tag.sh

      - name: Find the previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          prev="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')"
          count=""
          if [ -n "$prev" ]; then
            git rev-parse -q --verify "refs/tags/${prev}^{commit}" > /dev/null \
              || { echo "::error::Previous release tag $prev is not in the checkout."; exit 1; }
            count="$(git rev-list --count "${prev}..${SOURCE_SHA}")"
            if [ "$count" = 0 ]; then
              echo "::error::No commits since $prev. Nothing to release."
              exit 1
            fi
          fi
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Read the Gradle version
        id: gradle
        run: |
          version="$(sed -n 's/^ *gradle-version: *//p' .github/workflows/quality.yml | head -1)"
          [ -n "$version" ] || { echo "::error::No gradle-version in quality.yml."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Prepare signing
        env:
          KEYSTORE_B64: ${{ secrets.SPECTY_BASE64 }}
          SIGNING_ALIAS: ${{ secrets.SPECTY_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.SPECTY_PASSWORD }}
        run: bash .github/scripts/prepare-signing.sh

      - name: Build and package
        env:
          VERSION_NAME: ${{ steps.version.outputs.gradle_version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_VERSION: ${{ steps.version.outputs.apk_version }}
          APP: ${{ env.APP_NAME }}
          OUT_DIR: ${{ github.workspace }}/dist
          SIGNING_ALIAS: ${{ secrets.SPECTY_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.SPECTY_PASSWORD }}
        run: bash .github/scripts/build-variants.sh

      # Uses the [<version>] changelog section, or [Unreleased] when the version is not written down yet.
      - name: Build release notes
        env:
          VERSION: ${{ steps.version.outputs.gradle_version }}
          APK_VERSION: ${{ steps.version.outputs.apk_version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PREV_TAG: ${{ steps.previous.outputs.tag }}
          COMMIT_COUNT: ${{ steps.previous.outputs.count }}
        run: |
          python3 .github/scripts/release-notes.py \
            --changelog CHANGELOG.md \
            --app "$APP_NAME" --version "$VERSION" --apk-version "$APK_VERSION" \
            --repo "$GITHUB_REPOSITORY" --tag "v$VERSION" --source-sha "$SOURCE_SHA" \
            --prev-tag "$PREV_TAG" --commit-count "$COMMIT_COUNT" \
            --notes-out dist/notes.md \
            --changelog-out "dist/${APP_NAME}_${VERSION}_changelog.md"

      - name: Write checksums
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f -printf '%P\n' | sort | xargs sha256sum > "$RUNNER_TEMP/manifest.sha256"
          mv "$RUNNER_TEMP/manifest.sha256" manifest.sha256

      # Only hands the files to the publish job, so one day is enough.
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Specty_release_${{ steps.version.outputs.apk_version }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.jks"

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Write access creates the release and commits the changelog.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Specty_release_${{ needs.build.outputs.version }}
          path: release

      - name: Verify checksums
        working-directory: release
        run: sha256sum --check --strict manifest.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          APP: ${{ env.APP_NAME }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_DIR: release
        run: bash .github/scripts/publish-release.sh

      # Once the release is out, the [Unreleased] entries move under the version and
      # [Unreleased] starts empty again. A draft is not released yet, so it leaves the changelog alone.
      - name: Move the unreleased changelog under the version
        if: inputs.release_type != 'draft'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 .github/scripts/roll-changelog.py --changelog CHANGELOG.md --version "$VERSION"
          if git diff --quiet; then
            echo "Changelog already up to date."
            exit 0
          fi
          git config user.name RoTatsuLabs
          git config user.email 333611342+RoTatsuLabs@users.noreply.github.com
          git commit -am "docs: move the unreleased changelog to ${VERSION}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
