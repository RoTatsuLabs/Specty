name: Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.2.0 or 0.2.0-beta.1. Builds the selected branch and creates tag v<version>.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$version' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.RELEASE_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.VERSION }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify signature
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify "$apk"
          cp "$apk" "specty-$TAG.apk"
          sha256sum "specty-$TAG.apk" > "specty-$TAG.apk.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: specty-release
          path: specty-${{ env.TAG }}.apk*
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          bash .github/scripts/changelog.sh "$prev" > notes.md
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            target="--target $GITHUB_SHA"
          else
            target="--verify-tag"
          fi
          gh release create "$TAG" "specty-$TAG.apk" "specty-$TAG.apk.sha256" \
            $target --title "Specty $VERSION" --notes-file notes.md $pre

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
